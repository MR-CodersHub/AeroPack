<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#17283D"/>
      <stop offset="100%" stop-color="#0a1118"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C77D"/>
      <stop offset="50%" stop-color="#B99A63"/>
      <stop offset="100%" stop-color="#8C6D37"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A7E88"/>
      <stop offset="100%" stop-color="#285B62"/>
    </linearGradient>
  </defs>

  <!-- Background tile with subtle metallic border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.5"/>

  <!-- Telescopic Handle -->
  <path d="M26 14 V9 C26 7.5 27.5 6.5 29 6.5 H35 C36.5 6.5 38 7.5 38 9 V14" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="28" y="5" width="8" height="3" rx="1.5" fill="url(#goldGrad)"/>

  <!-- Suitcase Main Shell -->
  <rect x="15" y="14" width="34" height="39" rx="6" fill="url(#tealGrad)" stroke="url(#goldGrad)" stroke-width="2"/>

  <!-- Sleek Aero Velocity Curves -->
  <path d="M15 28 Q32 34 49 22" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M15 36 Q32 42 49 30" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Reinforced Corner Protectors -->
  <path d="M15 20 C15 16.5 17.5 14 21 14" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <path d="M43 14 C46.5 14 49 16.5 49 20" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <path d="M15 47 C15 50.5 17.5 53 21 53" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <path d="M43 53 C46.5 53 49 50.5 49 47" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>

  <!-- Dual Spinner Wheels -->
  <circle cx="22" cy="55.5" r="2.5" fill="url(#goldGrad)"/>
  <circle cx="42" cy="55.5" r="2.5" fill="url(#goldGrad)"/>
</svg>
