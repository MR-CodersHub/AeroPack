<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#285B62" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#17283D" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0E1926" stop-opacity="1"/>
    </radialGradient>

    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9DDCA"/>
      <stop offset="40%" stop-color="#B99A63"/>
      <stop offset="80%" stop-color="#8E7141"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>

    <!-- Teal Gradient -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4E9CA7"/>
      <stop offset="50%" stop-color="#285B62"/>
      <stop offset="100%" stop-color="#143439"/>
    </linearGradient>

    <!-- Suitcase Shell Gradient -->
    <linearGradient id="shellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A4659"/>
      <stop offset="35%" stop-color="#233044"/>
      <stop offset="100%" stop-color="#121D2C"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="tealGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="600" fill="url(#bgGlow)"/>

  <!-- Radar / Calibration Grid Lines -->
  <g opacity="0.15" stroke="#E9DDCA" stroke-width="1" stroke-dasharray="4,6">
    <circle cx="400" cy="320" r="260"/>
    <circle cx="400" cy="320" r="200"/>
    <circle cx="400" cy="320" r="140"/>
    <circle cx="400" cy="320" r="80"/>
    <line x1="140" y1="320" x2="660" y2="320"/>
    <line x1="400" y1="60" x2="400" y2="580"/>
    <line x1="216" y1="136" x2="584" y2="504"/>
    <line x1="216" y1="504" x2="584" y2="136"/>
  </g>

  <!-- Tech Telemetry Markers -->
  <g fill="#B99A63" opacity="0.6" font-family="'Plus Jakarta Sans', monospace" font-size="11">
    <text x="160" y="110">CALIB // FLIGHT_SYS_01</text>
    <text x="560" y="110">GEO-LAT: 40.7128 N</text>
    <text x="160" y="540">TORQUE_TOL: 0.02%</text>
    <text x="560" y="540">STATUS: RE-ENGINEERING</text>
  </g>

  <!-- Calibration Rings with Tick Marks -->
  <g transform="rotate(45 400 320)" opacity="0.4">
    <circle cx="400" cy="320" r="230" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="12,18"/>
  </g>
  <g transform="rotate(-25 400 320)" opacity="0.5">
    <circle cx="400" cy="320" r="175" fill="none" stroke="url(#tealGrad)" stroke-width="2" stroke-dasharray="30,8,6,8"/>
  </g>

  <!-- Base Pedestal / Laser Platform -->
  <ellipse cx="400" cy="460" rx="220" ry="36" fill="#0A121D" stroke="url(#goldGrad)" stroke-width="2" opacity="0.8"/>
  <ellipse cx="400" cy="456" rx="190" ry="26" fill="url(#tealGrad)" opacity="0.3" filter="url(#tealGlow)"/>
  <ellipse cx="400" cy="450" rx="140" ry="18" fill="none" stroke="#E9DDCA" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Vertical Laser Alignment Beams -->
  <line x1="260" y1="120" x2="260" y2="450" stroke="#4E9CA7" stroke-width="1.5" stroke-dasharray="8,6" opacity="0.7"/>
  <circle cx="260" cy="120" r="4" fill="#B99A63" filter="url(#goldGlow)"/>
  <circle cx="260" cy="450" r="4" fill="#4E9CA7"/>

  <line x1="540" y1="120" x2="540" y2="450" stroke="#4E9CA7" stroke-width="1.5" stroke-dasharray="8,6" opacity="0.7"/>
  <circle cx="540" cy="120" r="4" fill="#B99A63" filter="url(#goldGlow)"/>
  <circle cx="540" cy="450" r="4" fill="#4E9CA7"/>

  <!-- Precision Robotic Alignment Tool (Left Arm) -->
  <g stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 120,240 L 190,260 L 250,290 L 275,300"/>
    <circle cx="120" cy="240" r="8" fill="#17283D" stroke="#B99A63" stroke-width="3"/>
    <circle cx="190" cy="260" r="6" fill="#17283D" stroke="#B99A63" stroke-width="2"/>
    <circle cx="250" cy="290" r="5" fill="#17283D" stroke="#B99A63" stroke-width="2"/>
    <!-- Laser emitter -->
    <path d="M 275,300 L 290,295 M 275,300 L 290,305"/>
    <line x1="285" y1="300" x2="310" y2="300" stroke="#E9DDCA" stroke-width="2" filter="url(#goldGlow)"/>
  </g>

  <!-- Precision Robotic Alignment Tool (Right Arm) -->
  <g stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M 680,240 L 610,260 L 550,290 L 525,300"/>
    <circle cx="680" cy="240" r="8" fill="#17283D" stroke="#B99A63" stroke-width="3"/>
    <circle cx="610" cy="260" r="6" fill="#17283D" stroke="#B99A63" stroke-width="2"/>
    <circle cx="550" cy="290" r="5" fill="#17283D" stroke="#B99A63" stroke-width="2"/>
    <!-- Laser emitter -->
    <path d="M 525,300 L 510,295 M 525,300 L 510,305"/>
    <line x1="515" y1="300" x2="490" y2="300" stroke="#E9DDCA" stroke-width="2" filter="url(#goldGlow)"/>
  </g>

  <!-- Central Luggage Chassis in Calibration -->
  <g transform="translate(400,310)">
    <!-- Shadow under Suitcase -->
    <ellipse cx="0" cy="130" rx="95" ry="16" fill="#05090F" opacity="0.7" filter="url(#goldGlow)"/>

    <!-- Dual 360 Caster Wheels -->
    <g fill="#17283D" stroke="#B99A63" stroke-width="2">
      <!-- Left wheel assembly -->
      <rect x="-68" y="112" width="16" height="20" rx="4" fill="#30363D"/>
      <circle cx="-60" cy="126" r="6" fill="#B99A63"/>
      <!-- Right wheel assembly -->
      <rect x="52" y="112" width="16" height="20" rx="4" fill="#30363D"/>
      <circle cx="60" cy="126" r="6" fill="#B99A63"/>
    </g>

    <!-- Telescopic Aluminum Trolley Handle -->
    <!-- Extension Tubes -->
    <rect x="-32" y="-140" width="8" height="60" rx="2" fill="url(#goldGrad)"/>
    <rect x="24" y="-140" width="8" height="60" rx="2" fill="url(#goldGrad)"/>
    <!-- Cross Handle Grip -->
    <path d="M -40,-144 C -40,-154, 40,-154, 40,-144 L 34,-136 L -34,-136 Z" fill="#17283D" stroke="#B99A63" stroke-width="2"/>
    <rect x="-24" y="-148" width="48" height="8" rx="4" fill="#B99A63"/>

    <!-- Main Polycarbonate Suitcase Shell -->
    <rect x="-85" y="-85" width="170" height="200" rx="24" fill="url(#shellGrad)" stroke="url(#goldGrad)" stroke-width="3"/>

    <!-- Aerodynamic Velocity Grooves -->
    <g stroke="rgba(233,221,202,0.3)" stroke-width="2.5" stroke-linecap="round">
      <line x1="-55" y1="-50" x2="-55" y2="80"/>
      <line x1="-28" y1="-60" x2="-28" y2="90"/>
      <line x1="0" y1="-65" x2="0" y2="95"/>
      <line x1="28" y1="-60" x2="28" y2="90"/>
      <line x1="55" y1="-50" x2="55" y2="80"/>
    </g>

    <!-- Center Accent Velocity Groove -->
    <line x1="0" y1="-65" x2="0" y2="95" stroke="url(#goldGrad)" stroke-width="3.5" stroke-linecap="round" filter="url(#goldGlow)"/>

    <!-- Corner Armor Caps (Muted Gold & Aluminum) -->
    <path d="M -85,-65 C -85,-85, -65,-85, -65,-85 L -55,-85 L -85,-55 Z" fill="url(#goldGrad)"/>
    <path d="M 85,-65 C 85,-85, 65,-85, 65,-85 L 55,-85 L 85,-55 Z" fill="url(#goldGrad)"/>
    <path d="M -85,95 C -85,115, -65,115, -65,115 L -55,115 L -85,85 Z" fill="url(#goldGrad)"/>
    <path d="M 85,95 C 85,115, 65,115, 65,115 L 55,115 L 85,85 Z" fill="url(#goldGrad)"/>

    <!-- TSA Integrated Combination Lock (Gold Inset) -->
    <rect x="74" y="-5" width="14" height="40" rx="4" fill="#B99A63" stroke="#17283D" stroke-width="1.5"/>
    <circle cx="81" cy="8" r="2.5" fill="#17283D"/>
    <circle cx="81" cy="18" r="2.5" fill="#17283D"/>
    <circle cx="81" cy="28" r="2.5" fill="#17283D"/>

    <!-- Top Grab Handle -->
    <rect x="-28" y="-93" width="56" height="10" rx="4" fill="#17283D" stroke="#B99A63" stroke-width="1.5"/>

    <!-- Calibration Hologram Target -->
    <g transform="translate(0, 15)">
      <circle cx="0" cy="0" r="24" fill="none" stroke="#4E9CA7" stroke-width="1.5" stroke-dasharray="4,3" filter="url(#tealGlow)"/>
      <circle cx="0" cy="0" r="16" fill="none" stroke="#B99A63" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="4" fill="#E9DDCA"/>
      <line x1="-30" y1="0" x2="30" y2="0" stroke="#4E9CA7" stroke-width="1"/>
      <line x1="0" y1="-30" x2="0" y2="30" stroke="#4E9CA7" stroke-width="1"/>
    </g>
  </g>

  <!-- Wrench and Precision Caliper Accent Icons Floating -->
  <g transform="translate(560, 410) rotate(15)" opacity="0.85">
    <circle cx="0" cy="0" r="32" fill="#17283D" stroke="url(#goldGrad)" stroke-width="2"/>
    <!-- Gear icon -->
    <path d="M -12,-4 L -8,-4 L -6,-8 L -3,-6 L 0,-10 L 3,-6 L 6,-8 L 8,-4 L 12,-4 L 10,0 L 12,4 L 8,4 L 6,8 L 3,6 L 0,10 L -3,6 L -6,8 L -8,4 L -12,4 L -10,0 Z" fill="url(#goldGrad)"/>
    <circle cx="0" cy="0" r="3.5" fill="#17283D"/>
  </g>

  <g transform="translate(240, 410) rotate(-15)" opacity="0.85">
    <circle cx="0" cy="0" r="32" fill="#17283D" stroke="url(#goldGrad)" stroke-width="2"/>
    <!-- Wrench icon -->
    <path d="M -8,-6 C -12,-2 -10,6 -4,8 L 6,18 C 7,19 9,19 10,18 L 12,16 C 13,15 13,13 12,12 L 2,2 C 4,-4 -4,-12 -8,-6 Z" fill="url(#goldGrad)"/>
  </g>

  <!-- Upper Floating Status Banner Badge -->
  <g transform="translate(400, 75)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#17283D" stroke="url(#goldGrad)" stroke-width="1.5"/>
    <circle cx="-110" cy="0" r="5" fill="#285B62">
      <animate attributeName="fill" values="#285B62;#4E9CA7;#285B62" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="-95" y="4" fill="#E9DDCA" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">FLEET CALIBRATION // ACTIVE</text>
  </g>
</svg>